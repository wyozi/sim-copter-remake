[Mac DeviceProfile]
; Measured on an M1 (16 GB), Sea Cliff, 1280x720, Epic, parked on the hospital roof looking over the
; skyline: 102 ms -> 76 ms per frame with these two, and the screenshots are indistinguishable. See
; Docs/memory/mac-performance.md for the runs.
;
; The volumetric cloud layer's shadow map (the clouds shadowing the city) cost ~21 ms on its own.
; Its resolution and ray-sample CVars did not move the frame time at all - only switching it off
; did. The clouds themselves still draw.
+CVars=r.VolumetricCloud.ShadowMap=0
; Epic's AntiAliasingQuality sets a 200% TSR history. At 720p on an Apple GPU that is ~4 ms for no
; visible gain. Device-profile priority outranks scalability, so this holds at every AA level.
+CVars=r.TSR.History.ScreenPercentage=100

; The volumetric clouds, kept on Mac (Low Power Graphics included) because these make them cheap.
; Measured looking at the sky from above the hospital (M1, Low Power, 720p): the cloud layer cost
; ~42 ms. The r.VolumetricCloud.*SampleMaxCount CVars only clamp and changed nothing; the
; component's own sample-count scales did. At 0.25 the clouds cost ~3.6 ms and the screenshots
; (overhead and horizon) are indistinguishable. See SimCopterCloudTuning.h.
+CVars=SimCopter.Clouds.ViewSampleCountScale=0.25
+CVars=SimCopter.Clouds.ShadowViewSampleCountScale=0.25
+CVars=SimCopter.LowPower.KeepVolumetricClouds=1
; The real-time sky light capture re-renders the clouds into a cubemap; at the defaults it gave
; clouds a p95 of ~46 ms against ~20 ms without them. A 32^2 capture with quarter-res clouds and
; 16 reflection samples brings the p95 back to the no-cloud figure; the median is unchanged.
+CVars=r.SkyLight.RealTimeReflectionCapture.ResolutionOverride=32
+CVars=r.SkyLight.RealTimeReflectionCapture.VolumetricCloudResolutionDivider=4
+CVars=r.VolumetricCloud.ReflectionRaySampleMaxCount=16
